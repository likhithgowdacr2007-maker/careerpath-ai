<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareerPath AI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* CareerPath AI - style.css
   All colours, layout and component styles for the website. */
:root{--bg:#fff;--card:#f6f7ff;--tx:#1b1f3b;--mu:#5b6082;--b:#2563eb;--p:#7c3aed;--ln:#e3e5f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12142a;--card:#1c1f3d;--tx:#eef0ff;--mu:#a9aed3;--ln:#2d3160}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Plus Jakarta Sans',system-ui,sans-serif}
a{color:var(--b)}nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--ln);display:flex;gap:4px;padding:8px 12px;overflow-x:auto;z-index:5;align-items:center}
nav b{background:linear-gradient(90deg,var(--b),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:19px;margin-right:10px;white-space:nowrap}
nav a{padding:6px 12px;border-radius:99px;text-decoration:none;color:var(--mu);font-weight:600;font-size:14px;white-space:nowrap}nav a.on{background:var(--b);color:#fff}
main{max-width:1050px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:.2em 0;font-weight:800}h2{margin:.2em 0 .5em}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 18px;font:600 15px inherit;font-family:inherit;color:#fff;background:linear-gradient(90deg,var(--b),var(--p));cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}.btn.s{background:none;color:var(--b);border:1.5px solid var(--b)}.btn.sm{padding:5px 12px;font-size:13px}
.tag{display:inline-block;background:#7c3aed22;color:var(--p);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin:2px 3px 2px 0}.tag.ok{background:#16a34a22;color:#16a34a}.tag.demo{background:#f59e0b2a;color:#b45309}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--p))}
.hero{padding:30px 0}.hero p{max-width:60ch;color:var(--mu);font-size:18px}.jr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0}.jr a{background:var(--card);border:1px solid var(--ln);padding:10px 16px;border-radius:12px;text-decoration:none;font-weight:700;color:var(--tx)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);margin:4px 6px 4px 0;max-width:100%}
label.ck{display:inline-flex;gap:6px;align-items:center;margin:3px 10px 3px 0}.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln)}
table{border-collapse:collapse;width:100%;min-width:520px}td,th{border:1px solid var(--ln);padding:8px;text-align:left;vertical-align:top;font-size:14px}.sc{overflow-x:auto}.note{font-size:13px;color:var(--mu)}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}

</style>
</head>

<main id="app"></main>

'CI/CD':[2,'Intermediate',[['GitHub Actions docs','GitHub','https://docs.github.com/en/actions']]]};

ds:['Data Scientist','🔬','Uses statistics and models to find patterns and predict outcomes.',['Python','Mathematics','Statistics','Pandas','Data Visualization','Machine Learning'],'Python, Pandas, scikit-learn, Jupyter','ML Engineer or research roles'],
ml:['Machine Learning Engineer','🤖','Builds, tests and ships machine learning models.',['Python','Mathematics','Pandas','Machine Learning','Deep Learning','Git'],'Python, scikit-learn, PyTorch, Docker','AI Engineer or MLOps'],

const PR={da:[['Sales dashboard','Show monthly sales trends from a public CSV'],['SQL business report','Answer 10 business questions with SQL'],['End-to-end analysis','Clean data, find insights, present a story']],
ds:[['Exploratory data analysis','Explore a public dataset and share findings'],['Prediction model','Predict a value such as house prices'],['Full data science case','Frame a problem, model it, explain the results']],

do:[['Shell backup script','Automate a daily backup'],['Docker image for an app','Package an app to run anywhere'],['CI pipeline','Test and build on every commit']]};
const LV=['Beginner','Intermediate','Advanced'];
const Q=[['What do you enjoy most?',[['Finding patterns in numbers','da:2,ds:2,ml:1'],['Building things people can see and click','web:3,sw:1'],['Solving logic puzzles','sw:2,cy:1,ml:1'],['Teaching computers to learn','ml:2,ai:3,ds:1'],['Protecting systems from attacks','cy:3'],['Keeping systems running smoothly','do:2,cl:2']]],

<script>
// CareerPath AI - state.js
// App state, browser storage (localStorage), small helpers and the roadmap builder.
let S={p:{year:'1',deg:'B.Tech / B.E.',br:'Computer Science',ski:[],int:[],goal:''},c:'',done:{},pj:{},sv:[],q:null};
const ADMIN='admin@careerpath.local',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let U=L('cpai_cur'),AD=L('cpai_admin')||[];const key=()=>U?'cpai_u_'+U:'cpai',isAd=()=>U===ADMIN;
Object.assign(S,L(key())||{});const sv=()=>W(key(),S);
let cmp=[],F={q:'',l:'',t:''},ans=[];
const $=id=>document.getElementById(id),bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${p}"><i style="width:${p}%"></i></div>`;
const tags=a=>a.map(x=>`<span class="tag">${x}</span>`).join('');
const NAV=[['home','Home'],['profile','Profile'],['careers','Careers'],['quiz','Quiz'],['roadmap','Roadmap'],['courses','Courses'],['projects','Projects'],['hackathons','Hackathons'],['jobs','Jobs'],['gap','Skill Gap'],['dashboard','Dashboard'],['placement','Placement']];
const known=()=>new Set([...S.p.ski,...Object.keys(S.done).filter(k=>S.done[k])]);
function steps(){if(!S.c)return[];const k=new Set(S.p.ski),f=S.p.year>=3?.6:1;return C[S.c][3].map((s,i)=>({s,pre:k.has(s),w:Math.max(1,Math.round(SK[s][0]*f))}))}
function prog(){const st=steps();if(!st.length)return 0;return Math.round(st.filter(x=>x.pre||S.done[x.s]).length/st.length*100)}

</script>
<script>
// CareerPath AI - pages.js
// One function per page. Each returns the HTML for that page.
const pages={
home:()=>`<div class="hero"><h1>Your Career Journey Starts Here.</h1><p>CareerPath AI helps college students pick a career, learn the right skills in the right order, build projects, and find opportunities. Everything is in one place.</p>
<a class="btn" href="#careers">Explore Careers</a><a class="btn" href="#roadmap">Build My Roadmap</a><a class="btn s" href="#hackathons">Find Opportunities</a>
<div class="jr">${[['Discover','careers'],['Learn','courses'],['Build','projects'],['Compete','hackathons'],['Apply','jobs']].map((x,i)=>(i?'<b>→</b>':'')+`<a href="#${x[1]}">${x[0]}</a>`).join('')}</div></div>
<div class="g"><div class="card"><h3>🧭 Not sure what to choose?</h3><p>Take the 6-question quiz. Scores are worked out from your answers.</p><a class="btn sm" href="#quiz">Take the quiz</a></div><div class="card"><h3>🗺️ Roadmap that adapts</h3><p>Your year of study and skills change the plan and the time estimates.</p><a class="btn sm" href="#profile">Set up profile</a></div><div class="card"><h3>🎯 Skill gap check</h3><p>See what you already cover and what to learn next.</p><a class="btn sm" href="#gap">Check my gaps</a></div></div>`,
profile:()=>{const p=S.p;return`<h2>Student profile</h2><p class="note">Only study details are asked. Everything stays in this browser.</p><div class="card">
<p>Degree <select id="deg">${['B.Tech / B.E.','B.Sc','BCA','B.Com','BA','Other'].map(x=>`<option ${x==p.deg?'selected':''}>${x}</option>`).join('')}</select>
Branch <select id="br">${['Computer Science','Information Technology','Electronics','Electrical','Mechanical','Civil','Other'].map(x=>`<option ${x==p.br?'selected':''}>${x}</option>`).join('')}</select>
Year <select id="yr">${[1,2,3,4].map(x=>`<option ${x==p.year?'selected':''}>${x}</option>`).join('')}</select></p>
<p><b>Interests</b><br>${['Data','AI','Web','Security','Cloud','Apps'].map(x=>`<label class="ck"><input type="checkbox" name="int" value="${x}" ${p.int.includes(x)?'checked':''}>${x}</label>`).join('')}</p>
<p><b>Skills I already have</b><br>${Object.keys(SK).map(x=>`<label class="ck"><input type="checkbox" name="ski" value="${x}" ${p.ski.includes(x)?'checked':''}>${x}</label>`).join('')}</p>
<p><b>Career goal</b> <select id="goal"><option value="">Not decided</option>${Object.entries(C).map(([k,v])=>`<option value="${k}" ${k==S.c?'selected':''}>${v[0]}</option>`).join('')}</select></p><button class="btn" onclick="saveP()">Save profile</button><span id="ok" class="note"></span></div>`},
careers:()=>`<h2>Career explorer</h2><p class="note">Tick up to 3 careers to compare them.</p><div class="g">${Object.entries(C).map(([k,v])=>`<div class="card"><h3>${v[1]} ${v[0]}</h3><p>${v[2]}</p><p><b>Skills:</b> ${tags(v[3])}</p><p><b>Tools:</b> ${v[4]}</p><p><b>Example project:</b> ${PR[k][0][0]}</p><p><b>Next step:</b> ${v[5]}</p>
<label class="ck"><input type="checkbox" ${cmp.includes(k)?'checked':''} onchange="cp('${k}')">Compare</label><br><button class="btn sm" onclick="pick('${k}')">${S.c==k?'✓ Selected':'Choose this career'}</button></div>`).join('')}</div>
${cmp.length>1?`<h3>Comparison</h3><div class="sc"><table><tr><th></th>${cmp.map(k=>`<th>${C[k][0]}</th>`).join('')}</tr>${[['What it is',2],['Skills',3],['Tools',4],['Next step',5]].map(([n,i])=>`<tr><th>${n}</th>${cmp.map(k=>`<td>${i==3?C[k][3].join(', '):C[k][i]}</td>`).join('')}</tr>`).join('')}<tr><th>Learning time</th>${cmp.map(k=>`<td>about ${C[k][3].reduce((a,s)=>a+SK[s][0],0)} weeks</td>`).join('')}</tr></table></div>`:''}`,
quiz:()=>{if(S.q&&!ans.length)return qres();return`<h2>Career quiz</h2><form id="qf">${Q.map((q,i)=>`<div class="card" style="margin-bottom:12px"><b>${i+1}. ${q[0]}</b><br>${q[1].map((o,j)=>`<label class="ck"><input type="radio" name="q${i}" value="${j}" ${ans[i]==j?'checked':''}>${o[0]}</label>`).join('<br>')}</div>`).join('')}</form><button class="btn" onclick="qsub()">See my careers</button><span id="qe" class="note"></span>`},
roadmap:()=>{if(!S.c)return`<h2>My roadmap</h2><p>Choose a career first.</p><a class="btn" href="#careers">Explore careers</a> <a class="btn s" href="#quiz">Take the quiz</a>`;const st=steps(),y=S.p.year,sg=['Foundations','Core skills','Advanced skills'];
return`<h2>${C[S.c][1]} ${C[S.c][0]} roadmap</h2><p class="note">Made for year ${y}. ${y>=3?'Fast-track: time estimates are shorter because you have less time before placements.':'You have time. Go step by step.'} Skills from your profile are marked as already known.</p>${bar(prog())}<p><b>${prog()}% complete</b> · about ${st.filter(x=>!x.pre&&!S.done[x.s]).reduce((a,x)=>a+x.w,0)} weeks left</p>
${st.map((x,i)=>`${i==0||i==2||i==4?`<h3>${sg[Math.min(2,i/2|0)]}</h3>`:''}<div class="row"><input type="checkbox" aria-label="${x.s}" ${x.pre||S.done[x.s]?'checked':''} ${x.pre?'disabled':''} onchange="tog('${x.s}')"><div><b>${x.s}</b> ${x.pre?'<span class="tag ok">Already known</span>':`<span class="tag">~${x.w} weeks</span>`}<span class="tag">${SK[x.s][1]}</span><br>${SK[x.s][2].map(c=>`<a href="${c[2]}" target="_blank" rel="noopener">${c[0]}</a> (${c[1]})`).join(' · ')}</div></div>`).join('')}
${y==4?'<p class="card">Final year: also start <a href="#placement">placement preparation</a> now.</p>':''}<h3>Projects for this career</h3><a class="btn sm" href="#projects">See projects</a>`},
courses:()=>{return`<h2>Technical courses</h2><p class="note">Links go to the official provider pages. Items marked "Free + paid" have a free part but may charge for more. Please check details on the provider site.</p>
<input id="cq" placeholder="Search courses" value="${F.q}" oninput="F.q=this.value;cl()"><select id="cl" onchange="F.l=this.value;cl()"><option value="">All levels</option>${LV.map(l=>`<option ${F.l==l?'selected':''}>${l}</option>`).join('')}</select><select id="ct" onchange="F.t=this.value;cl()"><option value="">All topics</option>${Object.keys(SK).map(l=>`<option ${F.t==l?'selected':''}>${l}</option>`).join('')}</select><div class="g" id="cl2">${clist()}</div>`},
projects:()=>{const ks=S.c?[S.c]:Object.keys(C);return`<h2>Projects and portfolio</h2><p class="note">${S.c?'Showing projects for '+C[S.c][0]+'.':'Choose a career to focus this list.'} Mark progress to build your portfolio.</p><div class="g">${ks.flatMap(k=>PR[k].map((p,i)=>{const id=k+i,s=S.pj[id]||'Not started';return`<div class="card"><span class="tag">${LV[i]}</span><span class="tag">${C[k][0]}</span><h3>${p[0]}</h3><p><b>Problem:</b> ${p[1]}.</p><p><b>Skills:</b> ${C[k][3].slice(0,3).join(', ')}<br><b>Tools:</b> ${C[k][4]}</p><p><b>Steps:</b> 1. Plan the idea. 2. Get the data or set up tools. 3. Build a first version. 4. Test and improve. 5. Share it on GitHub.</p><p><b>Expected result:</b> a working ${p[0].toLowerCase()} with a short write-up.</p><select onchange="pj('${id}',this.value)">${['Not started','In progress','Completed'].map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('')}</select></div>`})).join('')}</div>
<h3>My portfolio</h3>${Object.entries(S.pj).filter(([k,v])=>v=='Completed').map(([id])=>`<span class="tag ok">✓ ${PR[id.slice(0,-1)][id.slice(-1)][0]}</span>`).join('')||'<p class="note">Completed projects will appear here.</p>'}`},
hackathons:()=>`<h2>Hackathons and competitions</h2><p class="card"><span class="tag demo">DEMO DATA</span> These are sample entries only, not real events. No real deadlines or links are shown. Check official organiser websites for real events.</p><div class="g">${H.map((h,i)=>opp('h'+i,h[0],h[1],h[2],h[3],[])).join('')}${AD.map((a,i)=>a.k=='h'?opp('a'+i,a.t,a.o,a.ty,a.el,a.sk,a):'').join('')}</div>`,
jobs:()=>`<h2>Internships and jobs</h2><p class="card"><span class="tag demo">DEMO DATA</span> These are sample listings, not real openings. Real data needs a verified source later.</p><input id="jq" placeholder="Search title or skill" oninput="jl()"><select id="jt" onchange="jl()"><option value="">All types</option><option>Internship</option><option>Job</option></select><div class="g" id="jl2">${jlist()}</div>`,
gap:()=>{const o=Object.entries(C).map(([k,v])=>`<option value="c${k}">Career: ${v[0]}</option>`).join('')+J.map((j,i)=>`<option value="j${i}">Demo listing: ${j[0]}</option>`).join('');return`<h2>Skill gap analyser</h2><p class="note">Rule: a skill counts as covered if it is in your profile or you completed it on your roadmap.</p><select id="gs" onchange="G=this.value;gr()"><option value="">Choose a target</option>${o.replace(`value="${G}"`,`value="${G}" selected`)}</select><div id="gr">${gres()}</div>`},
dashboard:()=>{const st=steps(),pj=Object.values(S.pj),nx=st.find(x=>!x.pre&&!S.done[x.s]);return`<h2>My dashboard</h2><div class="g"><div class="card"><h3>Career</h3><p>${S.c?C[S.c][1]+' '+C[S.c][0]:'None yet'}</p>${S.c?bar(prog())+'<p>'+prog()+'% of roadmap</p>':'<a class="btn sm" href="#careers">Choose</a>'}</div>
<div class="card"><h3>Courses and skills done</h3><p>${Object.values(S.done).filter(Boolean).length} skills completed</p></div><div class="card"><h3>Projects</h3><p>${pj.filter(x=>x=='In progress').length} in progress · ${pj.filter(x=>x=='Completed').length} completed</p></div>
<div class="card"><h3>Saved opportunities</h3>${S.sv.length?S.sv.map(x=>`<p>${x[1]}</p>`).join(''):'<p class="note">Nothing saved yet.</p>'}</div></div><div class="card" style="margin-top:14px"><h3>Recommended next action</h3><p>${!S.c?'Take the <a href="#quiz">quiz</a> or pick a career.':nx?`Learn <b>${nx.s}</b> (about ${nx.w} weeks). <a href="${SK[nx.s][2][0][2]}" target="_blank" rel="noopener">Start with ${SK[nx.s][2][0][0]}</a>.`:'Roadmap done! Build an <a href="#projects">advanced project</a> and prepare for <a href="#placement">placements</a>.'}</p></div>`},
placement:()=>`<h2>Placement preparation</h2><div class="g">${[['📝 Resume','One page. Name, contact, education, skills, 2 to 3 projects with results, links to GitHub. Use simple words and numbers.'],['💬 Technical interview topics','Your core subjects, data structures, basics of your career skills, and your own projects explained clearly.'],['⌨️ Coding practice','Practice daily on <a href="https://leetcode.com/" target="_blank" rel="noopener">LeetCode</a> or <a href="https://www.hackerrank.com/" target="_blank" rel="noopener">HackerRank</a>. Start with easy problems.'],['🧮 Aptitude','Practise quantitative, logical and verbal questions on <a href="https://www.indiabix.com/" target="_blank" rel="noopener">IndiaBix</a>.'],['🗂️ Portfolio','Keep 3 finished projects on GitHub with a clear README. See <a href="#projects">Projects</a>.'],['🎤 Interview prep','Practise "Tell me about yourself", explain each project in 2 minutes, and do mock interviews with friends.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`};
let G='';
pages.account=()=>U?`<h2>My account</h2><div class="card"><p>Signed in as <b>${esc(U)}</b></p><p class="note">Your profile, roadmap, projects and saved items are saved for this account in this browser only.</p><button class="btn" onclick="out()">Log out</button></div>`:`<h2>Login or sign up</h2><div class="card"><p class="note">Demo accounts live only in this browser. Passwords are scrambled (hashed), but this is not a real server login. Use a password you do not use anywhere else.</p><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)"><br><button class="btn" onclick="auth(1)">Log in</button><button class="btn s" onclick="auth(0)">Sign up</button><p id="ae" class="note"></p></div>`;
pages.admin=()=>!isAd()?`<h2>Admin area</h2><p>Only the admin account can open this page.</p>`:`<h2>Admin area</h2><p class="note">Add listings only from official sources. They are saved in this browser only.</p><div class="card"><select id="at"><option value="h">Hackathon / competition</option><option value="Internship">Internship</option><option value="Job">Job</option></select><input id="a1" placeholder="Title"><input id="a2" placeholder="Organiser / organisation"><input id="a3" placeholder="Eligibility"><input id="a4" placeholder="Official link (https://...)"><input id="a5" placeholder="Confirmed deadline (optional)"><input id="a6" placeholder="Skills, separated by commas"><br><button class="btn" onclick="addA()">Add listing</button><span id="am" class="note"></span></div><h3>Added listings</h3>${AD.map((a,i)=>`<div class="row"><div><b>${a.t}</b> <span class="tag">${a.ty}</span><br>${a.o}</div><button class="btn sm s" onclick="delA(${i})">Delete</button></div>`).join('')||'<p class="note">None yet.</p>'}`;

</script>
<script>
// CareerPath AI - auth.js
// Demo sign-up, login and logout (passwords hashed with SHA-256).
function fresh(){S={p:{year:'1',deg:'B.Tech / B.E.',br:'Computer Science',ski:[],int:[],goal:''},c:'',done:{},pj:{},sv:[],q:null}}
async function hs(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function auth(login){const e=$('em').value.trim().toLowerCase(),p=$('pw').value,m=$('ae');if(!/^\S+@\S+\.\S+$/.test(e)||p.length<6){m.textContent='Enter a valid email and a password with 6 or more characters.';return}
if(!(window.crypto&&crypto.subtle)){m.textContent='This browser cannot secure passwords here. Try Chrome or Edge.';return}
const us=L('cpai_users')||{},h=await hs(e+':'+p);
if(login){if(us[e]!==h){m.textContent='Wrong email or password.';return}}else{if(us[e]){m.textContent='This email already has an account. Please log in.';return}us[e]=h;W('cpai_users',us)}
U=e;W('cpai_cur',U);fresh();Object.assign(S,L(key())||{});sv();location.hash='#dashboard';rt()}
function out(){U=null;try{localStorage.removeItem('cpai_cur')}catch(e){}fresh();Object.assign(S,L('cpai')||{});location.hash='#home';rt()}

</script>
<script>
// CareerPath AI - tools.js
// Admin listings, job and course filters, and the skill-gap calculator.
function addA(){if(!isAd())return;const g=i=>esc($('a'+i).value.trim()),l=g(4),ty=$('at').value;if(!g(1)||!g(2)){$('am').textContent=' Title and organisation are needed.';return}if(l&&!/^https:\/\//.test(l)){$('am').textContent=' The link must start with https://';return}
AD.push({t:g(1),o:g(2),el:g(3)||'Not stated',l,d:g(5),sk:g(6).split(',').map(x=>x.trim()).filter(Boolean),ty:ty=='h'?'Hackathon':ty,k:ty=='h'?'h':'j'});W('cpai_admin',AD);rt()}
function delA(i){AD.splice(i,1);W('cpai_admin',AD);rt()}
function opp(id,t,o,ty,el,sk,x){const sd=S.sv.some(v=>v[0]==id);return`<div class="card">${x?'<span class="tag ok">Added by admin</span>':'<span class="tag demo">DEMO</span>'}<span class="tag">${ty}</span><h3>${t}</h3><p>${o}<br><b>Eligibility:</b> ${el}<br><b>Deadline:</b> ${x&&x.d||'not confirmed'}<br><b>Link:</b> ${x&&x.l?`<a href="${x.l}" target="_blank" rel="noopener">Official page</a>`:'none (demo)'}</p>${sk.length?`<p>${tags(sk)}</p>`:''}<button class="btn sm s" data-t="${t}" onclick="svo('${id}',this.dataset.t)">${sd?'✓ Saved':'Save'}</button></div>`}
function jlist(){const q=($('jq')||{value:''}).value.toLowerCase(),t=($('jt')||{value:''}).value,all=[...J.map((j,i)=>[j[0],j[1],j[2],j[3],j[4],'j'+i,0]),...AD.map((a,i)=>a.k=='j'?[a.t,a.o,a.ty,a.el,a.sk,'a'+i,a]:null).filter(Boolean)];return all.filter(j=>(!t||j[2]==t)&&(j[0]+j[4].join()).toLowerCase().includes(q)).map(j=>opp(j[5],j[0],j[1],j[2],j[3],j[4],j[6])).join('')||'<p>No matches.</p>'}
function jl(){$('jl2').innerHTML=jlist()}
function clist(){const q=F.q.toLowerCase();return Object.entries(SK).flatMap(([s,v])=>v[2].map(c=>[s,v[1],c])).filter(([s,l,c])=>(!F.l||l==F.l)&&(!F.t||s==F.t)&&(c[0]+c[1]+s).toLowerCase().includes(q)).map(([s,l,c])=>`<div class="card"><span class="tag">${s}</span><span class="tag">${l}</span><span class="tag ${c[3]?'demo':'ok'}">${c[3]?'Free + paid':'Free'}</span><h3>${c[0]}</h3><p>Provider: ${c[1]}</p><a class="btn sm" href="${c[2]}" target="_blank" rel="noopener">Open course</a></div>`).join('')||'<p>No matches.</p>'}
function cl(){$('cl2').innerHTML=clist()}
function gres(){if(!G)return'';const r=G[0]=='c'?C[G.slice(1)][3]:J[G.slice(1)][4],k=known(),ok=r.filter(x=>k.has(x)),no=r.filter(x=>!k.has(x)),p=Math.round(ok.length/r.length*100);return`<div class="card" style="margin-top:12px"><h3>${p}% match</h3>${bar(p)}<p><b>Covered:</b> ${ok.map(x=>`<span class="tag ok">${x}</span>`).join('')||'none yet'}</p><p><b>To improve:</b> ${tags(no)||'nothing, great!'}</p>${no.length?'<p><b>Next steps:</b></p>'+no.map(x=>`<p>• Learn ${x} (~${SK[x][0]} weeks): <a href="${SK[x][2][0][2]}" target="_blank" rel="noopener">${SK[x][2][0][0]}</a></p>`).join(''):''}</div>`}
function gr(){$('gr').innerHTML=gres()}

</script>
<script>
// CareerPath AI - quiz.js
// Career quiz result page and scoring.
function qres(){const r=S.q;return`<h2>Your top careers</h2><p class="note">Scores come from adding points for each answer you chose.</p>${r.map(x=>`<div class="card" style="margin-bottom:12px"><h3>${C[x[0]][1]} ${C[x[0]][0]} · ${x[1]}%</h3>${bar(x[1])}<p><b>Why:</b> ${x[2].length?x[2].join('; ')+'.':'It matched some of your answers.'}</p><button class="btn sm" onclick="pick('${x[0]}')">Choose this career</button></div>`).join('')}<button class="btn s" onclick="ans=[];S.q=null;sv();rt()">Retake quiz</button>`}
function qsub(){const f=$('qf'),a=Q.map((q,i)=>{const v=f.querySelector(`input[name=q${i}]:checked`);return v?+v.value:-1});if(a.includes(-1)){$('qe').textContent=' Please answer all questions.';return}
const sc={},why={};a.forEach((j,i)=>{const o=Q[i][1][j];o[1].split(',').filter(Boolean).forEach(t=>{const[k,n]=t.split(':');sc[k]=(sc[k]||0)+ +n;(why[k]=why[k]||[]).push('You chose "'+o[0].toLowerCase()+'"')})});
const mx=Math.max(1,...Object.values(sc));S.q=Object.entries(sc).sort((x,y)=>y[1]-x[1]).slice(0,3).map(([k,n])=>[k,Math.round(n/mx*100),why[k].slice(0,2)]);ans=[];sv();rt()}

</script>
<script>
// CareerPath AI - actions.js
// Small actions: save profile, pick career, compare, tick skills, project status, save items.
function saveP(){const g=n=>[...document.querySelectorAll(`input[name=${n}]:checked`)].map(x=>x.value);S.p={deg:$('deg').value,br:$('br').value,year:$('yr').value,int:g('int'),ski:g('ski'),goal:''};if($('goal').value)S.c=$('goal').value;sv();$('ok').textContent=' Saved ✓'}
function pick(k){S.c=k;sv();location.hash='#roadmap'}
function cp(k){cmp=cmp.includes(k)?cmp.filter(x=>x!=k):[...cmp,k].slice(-3);rt()}
function tog(s){S.done[s]=!S.done[s];sv();rt()}
function pj(id,v){S.pj[id]=v;sv();rt()}
function svo(id,t){S.sv=S.sv.some(x=>x[0]==id)?S.sv.filter(x=>x[0]!=id):[...S.sv,[id,esc(t)]];sv();rt()}

</script>
<script>
// CareerPath AI - app.js
// Router: reads the URL hash, draws the menu and the page. Starts the app.
function rt(){const h=(location.hash||'#home').slice(1),p=pages[h]?h:'home',y=scrollY;$('nav').innerHTML='<b>CareerPath AI</b>'+[...NAV,['account',U?'Account':'Login'],...(isAd()?[['admin','Admin']]:[])].map(n=>`<a href="#${n[0]}" class="${n[0]==p?'on':''}">${n[1]}</a>`).join('');$('app').innerHTML=pages[p]();scrollTo(0,y)}
addEventListener('hashchange',()=>{rt();scrollTo(0,0)});rt();

</script>
